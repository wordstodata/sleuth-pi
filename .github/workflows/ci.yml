name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # pi's packages pull native deps we never load here (extensions run
      # inside pi), and lifecycle scripts are not ours to run.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
